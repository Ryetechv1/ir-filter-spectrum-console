<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <style>
      .bg{fill:#0b1220}.panel{fill:#111b2d;stroke:#4b6587;stroke-width:2}.title{fill:#e8f2ff;font:700 28px Arial}
      .label{fill:#d8e6f7;font:600 18px Arial}.small{fill:#aebdd1;font:15px Arial}.pin{fill:#17253b;stroke:#7aa2d6;stroke-width:1.5}
      .wire5{stroke:#f7d154;stroke-width:5;fill:none}.wireg{stroke:#92a0b5;stroke-width:5;fill:none}.wires{stroke:#58b7ff;stroke-width:4;fill:none}.gate{stroke:#c084fc;stroke-width:4;fill:none}
      .ir{fill:#ff5f3f}.uva{fill:#9b5cff}.part{fill:#17253b;stroke:#8aaad6;stroke-width:1.5}.warn{fill:#ffd166;font:600 16px Arial}
    </style>
  </defs>
  <rect class="bg" width="1100" height="760"/>
  <text class="title" x="48" y="56">Prototype 2 - Camera Link + IR and UVA LEDs</text>
  <text class="small" x="48" y="86">Adds independent low-side MOSFET drivers for 950 nm IR and 375 nm UVA dimming from the Nano.</text>

  <rect class="panel" x="60" y="140" width="245" height="390" rx="12"/>
  <text class="label" x="98" y="180">Power + Logic</text>
  <rect class="part" x="93" y="232" width="120" height="56" rx="8"/><text class="small" x="118" y="265">5 V buck</text>
  <rect class="part" x="93" y="320" width="120" height="56" rx="8"/><text class="small" x="115" y="353">ESP32-CAM</text>
  <rect class="part" x="93" y="408" width="120" height="56" rx="8"/><text class="small" x="118" y="441">Nano</text>
  <path class="wire5" d="M213 260 H270 V436 H213"/>
  <path class="wireg" d="M93 348 H55 V436 H93"/>
  <path class="wires" d="M213 342 C275 365 275 408 213 426"/>
  <text class="small" x="82" y="500">Same serial wiring as Prototype 1</text>

  <rect class="panel" x="390" y="130" width="290" height="520" rx="12"/>
  <text class="label" x="430" y="170">IR LED Channel</text>
  <text class="small" x="428" y="205">Target: 950 nm, 50 mA max</text>
  <path class="wire5" d="M430 250 H585"/>
  <rect class="part" x="470" y="232" width="64" height="36" rx="6"/><text class="small" x="485" y="255">100R</text>
  <circle class="ir" cx="600" cy="250" r="24"/><text class="small" x="625" y="255">IR LED</text>
  <path class="wire5" d="M624 250 H640 V348"/>
  <rect class="part" x="606" y="348" width="68" height="72" rx="8"/><text class="small" x="623" y="391">NMOS</text>
  <path class="wireg" d="M640 420 V505 H430"/>
  <path class="gate" d="M470 382 H606"/>
  <text class="small" x="430" y="386">Nano D5 -> 150R gate</text>
  <text class="small" x="430" y="522">100k gate pulldown to GND</text>

  <rect class="panel" x="750" y="130" width="290" height="520" rx="12"/>
  <text class="label" x="790" y="170">UVA LED Channel</text>
  <text class="small" x="788" y="205">Target: 375 nm, 25-30 mA</text>
  <path class="wire5" d="M790 250 H945"/>
  <rect class="part" x="830" y="232" width="64" height="36" rx="6"/><text class="small" x="848" y="255">68R</text>
  <circle class="uva" cx="960" cy="250" r="24"/><text class="small" x="985" y="255">UVA LED</text>
  <path class="wire5" d="M984 250 H1000 V348"/>
  <rect class="part" x="966" y="348" width="68" height="72" rx="8"/><text class="small" x="983" y="391">NMOS</text>
  <path class="wireg" d="M1000 420 V505 H790"/>
  <path class="gate" d="M830 382 H966"/>
  <text class="small" x="790" y="386">Nano D6 -> 150R gate</text>
  <text class="small" x="790" y="522">100k gate pulldown to GND</text>

  <text class="warn" x="48" y="705">Shield UVA and IR. Do not aim emitters at eyes. Webapp selection: Prototype 2 enables IR/UVA only.</text>
</svg>
